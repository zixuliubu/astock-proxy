name: Capture A-share Intraday Nodes

on:
  workflow_dispatch:
    inputs:
      node:
        description: 'Scheduled China-time node, for example 09:15, 09:35 or 15:00. Leave empty to infer the latest elapsed node.'
        required: false
        type: string
      date:
        description: 'Optional trade date in YYYYMMDD. Leave empty for China today.'
        required: false
        type: string
  schedule:
    # Cron is UTC. The API stores the scheduled China-time label even when Actions starts late.
    - cron: '15 1 * * 1-5'
    - cron: '20 1 * * 1-5'
    - cron: '25 1 * * 1-5'
    - cron: '35 1 * * 1-5'
    - cron: '45 1 * * 1-5'
    - cron: '55 1 * * 1-5'
    - cron: '5 2 * * 1-5'
    - cron: '15 2 * * 1-5'
    - cron: '25 2 * * 1-5'
    - cron: '35 2 * * 1-5'
    - cron: '45 2 * * 1-5'
    - cron: '55 2 * * 1-5'
    - cron: '5 3 * * 1-5'
    - cron: '15 3 * * 1-5'
    - cron: '25 3 * * 1-5'
    - cron: '5 5 * * 1-5'
    - cron: '15 5 * * 1-5'
    - cron: '25 5 * * 1-5'
    - cron: '35 5 * * 1-5'
    - cron: '45 5 * * 1-5'
    - cron: '55 5 * * 1-5'
    - cron: '5 6 * * 1-5'
    - cron: '15 6 * * 1-5'
    - cron: '25 6 * * 1-5'
    - cron: '35 6 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '55 6 * * 1-5'
    - cron: '0 7 * * 1-5'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve scheduled node
        id: node
        shell: bash
        env:
          INPUT_NODE: ${{ github.event.inputs.node }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_NODE" ]; then
            NODE="$INPUT_NODE"
          else
            case "$SCHEDULE" in
              "15 1 * * 1-5") NODE="09:15" ;;
              "20 1 * * 1-5") NODE="09:20" ;;
              "25 1 * * 1-5") NODE="09:25" ;;
              "35 1 * * 1-5") NODE="09:35" ;;
              "45 1 * * 1-5") NODE="09:45" ;;
              "55 1 * * 1-5") NODE="09:55" ;;
              "5 2 * * 1-5") NODE="10:05" ;;
              "15 2 * * 1-5") NODE="10:15" ;;
              "25 2 * * 1-5") NODE="10:25" ;;
              "35 2 * * 1-5") NODE="10:35" ;;
              "45 2 * * 1-5") NODE="10:45" ;;
              "55 2 * * 1-5") NODE="10:55" ;;
              "5 3 * * 1-5") NODE="11:05" ;;
              "15 3 * * 1-5") NODE="11:15" ;;
              "25 3 * * 1-5") NODE="11:25" ;;
              "5 5 * * 1-5") NODE="13:05" ;;
              "15 5 * * 1-5") NODE="13:15" ;;
              "25 5 * * 1-5") NODE="13:25" ;;
              "35 5 * * 1-5") NODE="13:35" ;;
              "45 5 * * 1-5") NODE="13:45" ;;
              "55 5 * * 1-5") NODE="13:55" ;;
              "5 6 * * 1-5") NODE="14:05" ;;
              "15 6 * * 1-5") NODE="14:15" ;;
              "25 6 * * 1-5") NODE="14:25" ;;
              "35 6 * * 1-5") NODE="14:35" ;;
              "45 6 * * 1-5") NODE="14:45" ;;
              "55 6 * * 1-5") NODE="14:55" ;;
              "0 7 * * 1-5") NODE="15:00" ;;
              *) NODE="" ;;
            esac
          fi
          echo "node=$NODE" >> "$GITHUB_OUTPUT"

      - name: Capture node snapshot
        shell: bash
        env:
          CAPTURE_SECRET: ${{ secrets.CAPTURE_SECRET }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          NODE: ${{ steps.node.outputs.node }}
        run: |
          URL="https://astock-proxy.vercel.app/api/capture-node"
          if [ -n "$NODE" ]; then
            URL="$URL?node=$NODE"
          fi
          if [ -n "$INPUT_DATE" ]; then
            if [[ "$URL" == *"?"* ]]; then
              URL="$URL&date=$INPUT_DATE"
            else
              URL="$URL?date=$INPUT_DATE"
            fi
          fi
          echo "Capturing scheduled China-time node ${NODE:-latest elapsed node}"
          curl -fsS "$URL" \
            -H "x-capture-token: $CAPTURE_SECRET" \
            -H "Accept: application/json"
